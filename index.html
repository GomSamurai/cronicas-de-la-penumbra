<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crónicas de la Penumbra</title>
    <script>
      // Inmunidad contra Service Workers de otros proyectos de localhost (PWA como Soundscape Studio)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'void': '#050505',          // Main background (darker than obsidian)
              'panel': '#121212',         // Card/Panel background
              'panel-border': '#2a2a2a',  // Subtle borders
              'bone': '#e5e5e5',          // High contrast text
              'parchment': '#d4c5a9',     // Normal reading text
              'parchment-dim': '#948c7e', // Secondary text
              'gold': '#c5a059',          // Accents/Highlights
              'gold-dim': '#5c4d2e',      // Borders/Muted accents
              'blood': '#8a1c1c',         // HP bars, deep elements
              'blood-bright': '#ff5555',  // Text alerts (High contrast on dark)
              'sanity': '#4b5c85',        // Sanity color
            },
            fontFamily: {
              serif: ['Cormorant Garamond', 'serif'],
              display: ['Cinzel', 'serif'],
              hand: ['Playfair Display', 'serif'],
            },
            animation: {
              'fade-in': 'fadeIn 1s ease-out forwards',
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'ember': 'ember-drift 10s linear infinite',
              'damage-flash': 'damageFlash 0.5s ease-out',
              'heartbeat-visual': 'heartbeatVisual 1s ease-in-out infinite',
              'spin-fast': 'spin 0.4s linear infinite',
              'pulse-fast': 'pulse 0.4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'ember-drift': {
                '0%': { opacity: '0', transform: 'translateY(0) translateX(0)' },
                '20%': { opacity: '0.8' },
                '80%': { opacity: '0.4' },
                '100%': { opacity: '0', transform: 'translateY(-60px) translateX(20px)' },
              },
              damageFlash: {
                '0%': { opacity: '0' },
                '10%': { opacity: '0.8' },
                '100%': { opacity: '0' },
              },
              heartbeatVisual: {
                '0%, 100%': { transform: 'scale(1)' },
                '10%': { transform: 'scale(1.02)' },
                '20%': { transform: 'scale(1)' },
                '30%': { transform: 'scale(1.02)' },
                '40%': { transform: 'scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');
      
      body {
        background-color: #050505;
        color: #d4c5a9;
      }
      
      /* Subtle noise texture */
      .bg-texture {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
      }

      /* Vignette Overlay */
      .bg-vignette {
        background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.4) 70%, #050505 100%);
        pointer-events: none;
      }

      /* Atmospheric Tension Vignettes */
      .vignette-combate {
        background: radial-gradient(circle at center, transparent 35%, rgba(138, 28, 28, 0.25) 75%, rgba(138, 28, 28, 0.6) 100%);
        animation: combatPulse 2s ease-in-out infinite;
        pointer-events: none;
      }
      .vignette-peligro {
        background: radial-gradient(circle at center, transparent 45%, rgba(180, 80, 10, 0.2) 80%, rgba(140, 50, 10, 0.45) 100%);
        animation: dangerPulse 4s ease-in-out infinite;
        pointer-events: none;
      }
      .vignette-agonico {
        background: radial-gradient(circle at center, transparent 25%, rgba(110, 10, 10, 0.4) 65%, rgba(40, 0, 0, 0.85) 100%);
        animation: agonyPulse 1.2s ease-in-out infinite;
        pointer-events: none;
      }
      .vignette-sospecha {
        background: radial-gradient(circle at center, transparent 40%, rgba(20, 25, 40, 0.3) 75%, rgba(5, 5, 15, 0.6) 100%);
        pointer-events: none;
      }
      .vignette-tension {
        background: radial-gradient(circle at center, transparent 40%, rgba(70, 50, 20, 0.2) 75%, rgba(40, 30, 10, 0.5) 100%);
        pointer-events: none;
      }

      @keyframes combatPulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.015); }
      }
      @keyframes dangerPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.85; }
      }
      @keyframes agonyPulse {
        0%, 100% { opacity: 0.7; transform: scale(1); filter: contrast(105%); }
        25% { opacity: 1; transform: scale(1.02); filter: contrast(125%); }
        45% { opacity: 0.75; transform: scale(1.005); }
        65% { opacity: 0.95; transform: scale(1.015); filter: contrast(120%); }
      }

      /* Ash/Ember Particles */
      .ash-particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #c5a059;
        border-radius: 50%;
        pointer-events: none;
        animation: ember var(--duration) linear infinite;
        animation-delay: var(--delay);
        opacity: 0;
        box-shadow: 0 0 4px 1px rgba(197, 160, 89, 0.4);
        mix-blend-mode: screen;
      }

      /* Mist/Fog Animations */
      @keyframes mist-drift-1 {
        0% { transform: translate(-10%, -10%) rotate(0deg); opacity: 0.3; }
        50% { transform: translate(5%, 5%) rotate(2deg); opacity: 0.5; }
        100% { transform: translate(-10%, -10%) rotate(0deg); opacity: 0.3; }
      }
      @keyframes mist-drift-2 {
        0% { transform: translate(5%, 10%) rotate(0deg); opacity: 0.2; }
        50% { transform: translate(-10%, -5%) rotate(-2deg); opacity: 0.4; }
        100% { transform: translate(5%, 10%) rotate(0deg); opacity: 0.2; }
      }

      .bg-mist {
         position: absolute;
         top: -50%;
         left: -50%;
         width: 200%;
         height: 200%;
         background: radial-gradient(ellipse at center, rgba(40, 40, 45, 0.4), transparent 60%);
         filter: blur(60px);
         pointer-events: none;
         z-index: 0;
         mix-blend-mode: screen;
      }
      
      .animate-mist-1 { animation: mist-drift-1 45s ease-in-out infinite; }
      .animate-mist-2 { animation: mist-drift-2 60s ease-in-out infinite reverse; }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border: 1px solid #111;
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
        border-color: #c5a059;
      }
      
      .drop-cap::first-letter {
        float: left;
        font-family: 'Cinzel', serif;
        font-size: 3.8rem;
        line-height: 0.85;
        padding-right: 12px;
        padding-top: 2px;
        color: #c5a059;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }

      /* --- NEW VISCERAL EFFECTS SYSTEM --- */

      /* 1. Dynamic Chromatic Aberration 
         Uses CSS variable --aberration-amount controlled by React state.
      */
      .dynamic-aberration {
         --red-offset: calc(var(--aberration-amount, 0px) * 1);
         --blue-offset: calc(var(--aberration-amount, 0px) * -1);
         text-shadow: 
            var(--red-offset) 0 rgba(255, 0, 0, 0.4),
            var(--blue-offset) 0 rgba(0, 255, 255, 0.4);
         transition: text-shadow 0.5s ease-out;
      }

      /* 2. Text Instability (The "Faint") 
         Triggered intermittently via class toggle.
      */
      .text-instability {
         animation: text-blur-shake 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      }

      @keyframes text-blur-shake {
         0% { filter: blur(0px); opacity: 1; transform: translate3d(0, 0, 0); }
         20% { filter: blur(0.5px); opacity: 0.9; transform: translate3d(-0.5px, 0.5px, 0); }
         40% { filter: blur(1px); opacity: 0.75; transform: translate3d(0.5px, -0.5px, 0); }
         60% { filter: blur(0.5px); opacity: 0.9; transform: translate3d(-0.5px, 0, 0); }
         100% { filter: blur(0px); opacity: 1; transform: translate3d(0, 0, 0); }
      }

      /* Title Glitch (Kept separate for style) */
      @keyframes chromatic-pulse {
         0% { text-shadow: 2px 0 rgba(255,0,0,0.5), -2px 0 rgba(0,0,255,0.5); }
         50% { text-shadow: 0 2px rgba(255,0,0,0.5), 0 -2px rgba(0,0,255,0.5); }
         100% { text-shadow: 2px 0 rgba(255,0,0,0.5), -2px 0 rgba(0,0,255,0.5); }
      }
      .chromatic-aberration {
         animation: chromatic-pulse 4s infinite linear;
      }

      /* --- NUEVOS EFECTOS VISCERALES DINÁMICOS --- */

      /* 1. Viñeta de Locura / Delirio (Living Shadows) */
      .vignette-madness {
        background: radial-gradient(circle at center, transparent 30%, rgba(20, 5, 25, 0.45) 65%, rgba(5, 0, 10, 0.85) 100%);
        pointer-events: none;
        animation: madnessBreath 5s ease-in-out infinite alternate;
      }
      @keyframes madnessBreath {
        0% { transform: scale(1); opacity: 0.75; }
        100% { transform: scale(1.035); opacity: 1; }
      }

      /* 2. Pantalla en Agonía (Desaturación y Pérdida de Color) */
      .agony-screen {
        filter: grayscale(42%) contrast(112%) sepia(18%);
        transition: filter 1.2s ease-in-out;
      }

      /* 3. Pulso Arterial Carmesí (Sangrado / Near Death) */
      .arterial-pulse {
        box-shadow: inset 0 0 60px rgba(185, 28, 28, 0.55), inset 0 0 120px rgba(88, 10, 10, 0.45);
        animation: arterialBeat 1.3s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        pointer-events: none;
      }
      @keyframes arterialBeat {
        0%, 100% { opacity: 0.45; }
        25% { opacity: 0.95; }
        45% { opacity: 0.6; }
        65% { opacity: 0.88; }
      }

      /* 4. Desvanecimiento de Párpados / Faint de Visión */
      .eyelid-faint {
        animation: eyelidBlurWave 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes eyelidBlurWave {
        0% { filter: blur(0px); opacity: 1; }
        35% { filter: blur(1.8px); opacity: 0.8; transform: scale(0.998); }
        65% { filter: blur(0.7px); opacity: 0.92; }
        100% { filter: blur(0px); opacity: 1; transform: scale(1); }
      }

      /* 5. Temblores Tipográficos de Locura / Delirio */
      .madness-text-jitter {
        animation: jitterText 0.35s infinite alternate;
        letter-spacing: 0.015em;
      }
      @keyframes jitterText {
        0% { transform: translate(0, 0); }
        25% { transform: translate(-0.35px, 0.35px); }
        50% { transform: translate(0.35px, -0.2px); }
        75% { transform: translate(-0.25px, -0.35px); }
        100% { transform: translate(0.3px, 0.25px); }
      }

      /* 6. Texto Espectral con Halo Bicromático */
      .madness-spectral-text {
        text-shadow: 1.5px 0 rgba(220, 38, 38, 0.55), -1.5px 0 rgba(6, 182, 212, 0.55);
        transition: text-shadow 0.4s ease;
      }
      .madness-spectral-extreme {
        text-shadow: 2.8px 0 rgba(220, 38, 38, 0.75), -2.8px 0 rgba(6, 182, 212, 0.75), 0 2px rgba(168, 85, 247, 0.4);
        animation: spectralPulse 2.5s ease-in-out infinite alternate;
      }
          /* --- GRIMDARK LUXURY DESIGN SYSTEM --- */
      .gothic-panel {
        background: linear-gradient(180deg, rgba(20, 18, 16, 0.96) 0%, rgba(9, 8, 7, 0.98) 100%);
        border: 1px solid rgba(197, 160, 89, 0.25);
        box-shadow: 
          inset 0 1px 0 0 rgba(197, 160, 89, 0.2),
          inset 0 0 40px rgba(0, 0, 0, 0.85),
          0 12px 40px rgba(0, 0, 0, 0.85);
        position: relative;
      }

      .gothic-panel-inner {
        background: radial-gradient(circle at 50% 0%, rgba(26, 23, 20, 0.8) 0%, rgba(8, 7, 6, 0.95) 100%);
      }

      .gothic-filigree-border {
        border: 1px solid rgba(197, 160, 89, 0.3);
        outline: 1px solid rgba(197, 160, 89, 0.12);
        outline-offset: -4px;
      }

      .talisman-card {
        background: radial-gradient(circle at 50% 0%, rgba(32, 28, 23, 0.95), rgba(10, 9, 8, 0.98));
        border: 1px solid rgba(197, 160, 89, 0.22);
        box-shadow: 
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          inset 0 -1px 0 rgba(0, 0, 0, 0.9),
          0 4px 14px rgba(0, 0, 0, 0.7);
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .talisman-card:hover {
        border-color: rgba(197, 160, 89, 0.6);
        box-shadow: 
          inset 0 1px 0 rgba(197, 160, 89, 0.35),
          0 0 20px rgba(197, 160, 89, 0.18),
          0 6px 18px rgba(0, 0, 0, 0.85);
        transform: translateY(-1.5px);
      }

      .stat-bezel {
        background: #090807;
        border: 1px solid rgba(92, 77, 46, 0.55);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(197, 160, 89, 0.15);
        padding: 2px;
        border-radius: 9999px;
      }
      .blood-liquid {
        background: linear-gradient(90deg, #480c0c 0%, #8a1c1c 50%, #c42828 100%);
        box-shadow: 0 0 12px rgba(196, 40, 40, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .sanity-liquid {
        background: linear-gradient(90deg, #162035 0%, #3a4b75 50%, #5d75b0 100%);
        box-shadow: 0 0 12px rgba(93, 117, 176, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .choice-decree {
        background: linear-gradient(135deg, rgba(22, 19, 16, 0.95) 0%, rgba(10, 9, 8, 0.98) 100%);
        border: 1px solid rgba(197, 160, 89, 0.28);
        box-shadow: 
          inset 0 1px 0 rgba(197, 160, 89, 0.2),
          0 4px 16px rgba(0, 0, 0, 0.7);
        transition: all 0.25s ease-out;
      }
      .choice-decree:hover {
        background: linear-gradient(135deg, rgba(34, 28, 22, 0.98) 0%, rgba(16, 14, 12, 1) 100%);
        border-color: rgba(197, 160, 89, 0.75);
        box-shadow: 
          inset 0 1px 0 rgba(197, 160, 89, 0.4),
          0 0 25px rgba(197, 160, 89, 0.2),
          0 8px 25px rgba(0, 0, 0, 0.85);
        transform: translateY(-2px);
      }

      .gothic-tab {
        background: linear-gradient(180deg, rgba(24, 21, 18, 0.9) 0%, rgba(12, 10, 9, 0.95) 100%);
        border: 1px solid rgba(197, 160, 89, 0.2);
        transition: all 0.2s ease;
      }
      .gothic-tab-active {
        background: linear-gradient(180deg, rgba(42, 34, 25, 0.95) 0%, rgba(18, 15, 12, 1) 100%);
        border-color: rgba(197, 160, 89, 0.6);
        box-shadow: inset 0 1px 0 rgba(197, 160, 89, 0.4), 0 2px 10px rgba(0, 0, 0, 0.5);
      }

      .relic-card {
        background: linear-gradient(180deg, rgba(18, 16, 14, 0.85) 0%, rgba(9, 8, 7, 0.95) 100%);
        border: 1px solid rgba(197, 160, 89, 0.18);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 3px 10px rgba(0, 0, 0, 0.5);
        transition: all 0.2s ease;
      }
      .relic-card:hover {
        border-color: rgba(197, 160, 89, 0.5);
        background: linear-gradient(180deg, rgba(28, 24, 20, 0.9) 0%, rgba(14, 12, 10, 0.98) 100%);
        box-shadow: inset 0 1px 0 rgba(197, 160, 89, 0.25), 0 4px 15px rgba(0, 0, 0, 0.7);
      }
    </style>
